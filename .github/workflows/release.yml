name: Build and publish Night Browser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check release version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }

      - name: Install, test, and audit
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }
          npm audit --omit=dev
          if ($LASTEXITCODE -ne 0) { throw "Production dependency audit failed." }
          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { throw "Dependency audit failed." }
        shell: pwsh

      - name: Prepare optional Windows signing certificate
        shell: pwsh
        env:
          NOVA_WINDOWS_CERT_BASE64: ${{ secrets.NOVA_WINDOWS_CERT_BASE64 }}
          NOVA_WINDOWS_CERT_PASSWORD: ${{ secrets.NOVA_WINDOWS_CERT_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:NOVA_WINDOWS_CERT_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:NOVA_WINDOWS_CERT_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Configure both Windows signing secrets, or remove both to publish an unsigned installer."
          }
          if ($hasCertificate) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "night-browser-code-signing.pfx"
            $certificateBytes = [Convert]::FromBase64String($env:NOVA_WINDOWS_CERT_BASE64)
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
            "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Warning "No Windows signing certificate is configured. The installer will be unsigned."
          }

      - name: Build Windows installer
        run: npm run dist -- --publish never
        env:
          CSC_KEY_PASSWORD: ${{ secrets.NOVA_WINDOWS_CERT_PASSWORD }}

      - name: Verify Windows installer
        shell: pwsh
        env:
          NOVA_WINDOWS_CERT_BASE64: ${{ secrets.NOVA_WINDOWS_CERT_BASE64 }}
          NOVA_WINDOWS_CERT_PASSWORD: ${{ secrets.NOVA_WINDOWS_CERT_PASSWORD }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path "release" "Night-Browser-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Windows installer was not produced: $installer"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NOVA_WINDOWS_CERT_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:NOVA_WINDOWS_CERT_PASSWORD)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne "Valid") {
              throw "Invalid signature for $installer`: $($signature.StatusMessage)"
            }
          }
          if (-not (Test-Path -LiteralPath "release\latest.yml")) {
            throw "electron-builder did not produce latest.yml."
          }

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install AppImage runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2

      - name: Check release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag version $tag_version does not match package version $package_version."
            exit 1
          }

      - name: Install, test, and audit
        run: |
          npm ci
          npm test
          npm audit --omit=dev
          npm audit --audit-level=moderate

      - name: Build Linux AppImage and Debian packages
        run: npm run dist:linux -- --publish never

      - name: Verify Linux release files
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "release/Night-Browser-${version}-x86_64.AppImage"
          test -f "release/Night-Browser-${version}-amd64.deb"
          test -f release/latest-linux.yml

      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.blockmap
            app/release/latest-linux.yml

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Download Linux release files
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release/linux

      - name: Create release and upload all platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Night Browser $version" \
            --generate-notes
          find release/windows release/linux -maxdepth 1 -type f -print0 |
            while IFS= read -r -d '' asset; do
              gh release upload "$RELEASE_TAG" "$asset"
            done
